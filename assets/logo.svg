<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="statichost logo">
  <title>statichost</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="ray" x1="0" y1="0" x2="0" y2="1" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <radialGradient id="dot" cx="0.35" cy="0.35" r="0.7">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </radialGradient>
    <radialGradient id="core" cx="0.35" cy="0.35" r="0.7">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <g transform="translate(256 256)" filter="url(#glow)">
    <g stroke="url(#ray)" stroke-width="22" stroke-linecap="round" fill="none">
      <line x1="0" y1="0" x2="0" y2="-150"/>
      <line x1="0" y1="0" x2="130" y2="-75"/>
      <line x1="0" y1="0" x2="130" y2="75"/>
      <line x1="0" y1="0" x2="0" y2="150"/>
      <line x1="0" y1="0" x2="-130" y2="75"/>
      <line x1="0" y1="0" x2="-130" y2="-75"/>
    </g>
  </g>

  <g transform="translate(256 256)">
    <circle cx="0" cy="-150" r="26" fill="url(#dot)"/>
    <circle cx="130" cy="-75" r="26" fill="url(#dot)"/>
    <circle cx="130" cy="75" r="26" fill="url(#dot)"/>
    <circle cx="0" cy="150" r="26" fill="url(#dot)"/>
    <circle cx="-130" cy="75" r="26" fill="url(#dot)"/>
    <circle cx="-130" cy="-75" r="26" fill="url(#dot)"/>
  </g>

  <circle cx="256" cy="256" r="38" fill="url(#core)"/>
  <circle cx="256" cy="256" r="38" fill="none" stroke="#0f172a" stroke-width="3" opacity="0.3"/>
</svg>
