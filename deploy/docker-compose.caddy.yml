# statichost + Caddy with on-demand TLS — self-contained, no Cloudflare needed.
#
# Caddy issues per-subdomain Let's Encrypt certs on demand (no DNS API access required).
# Works on any host with public ports 80 + 443 reachable from the internet.
#
# Usage:
#   1. Set STATICHOST_DOMAIN to your real domain in env or below
#   2. Point a wildcard A record `*.your-domain.com` to this host's public IP
#      (and an A record for the apex `your-domain.com` if you want to reach it)
#   3. STATICHOST_TOKEN=$(openssl rand -hex 32) docker compose up -d
#
# Caddy on-demand TLS will fetch certs the first time each subdomain is hit.
# Let's Encrypt rate limit: 50 certs / week per registered domain. Plenty for static deploys;
# tight if you spawn dozens of ephemeral tunnel names per week.

services:
  statichost:
    image: jacobmoura7/statichost:latest
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      STATICHOST_TOKEN: "${STATICHOST_TOKEN:?set STATICHOST_TOKEN}"
      STATICHOST_DOMAIN: "${STATICHOST_DOMAIN:?set STATICHOST_DOMAIN}"
    volumes:
      - sites:/sites

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      STATICHOST_DOMAIN: "${STATICHOST_DOMAIN}"
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy-data:/data
      - caddy-config:/config

configs:
  caddyfile:
    content: |
      # On-demand TLS for any subdomain of STATICHOST_DOMAIN.
      # Caddy issues certs the first time each hostname is hit.
      #
      # Note: there's no `ask` endpoint here, so any hostname that resolves to
      # this server's IP will trigger a cert request. The wildcard DNS keeps this
      # to your own zone, but if you're paranoid about Let's Encrypt rate limits,
      # restrict your DNS to subdomains you actually use.

      *.{$STATICHOST_DOMAIN} {
        tls {
          on_demand
        }
        reverse_proxy statichost:3000
      }

      {$STATICHOST_DOMAIN} {
        reverse_proxy statichost:3000
      }

volumes:
  sites:
  caddy-data:
  caddy-config:
