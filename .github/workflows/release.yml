name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  build-binaries:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: statichost-linux-amd64
            use_cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: statichost-linux-arm64
            use_cross: true
          - target: x86_64-apple-darwin
            os: macos-13
            artifact: statichost-darwin-amd64
            use_cross: false
          - target: aarch64-apple-darwin
            os: macos-14
            artifact: statichost-darwin-arm64
            use_cross: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: statichost-windows-amd64.exe
            use_cross: false
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: install cross
        if: matrix.use_cross == true
        run: cargo install cross --locked

      - name: build cli
        shell: bash
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} -p statichost-cli --bin statichost
          else
            cargo build --release --target ${{ matrix.target }} -p statichost-cli --bin statichost
          fi

      - name: stage artifact
        shell: bash
        run: |
          mkdir -p dist
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp target/${{ matrix.target }}/release/statichost.exe dist/${{ matrix.artifact }}
          else
            cp target/${{ matrix.target }}/release/statichost dist/${{ matrix.artifact }}
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  release:
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: collect
        run: |
          mkdir -p dist
          find artifacts -type f -exec cp {} dist/ \;
          ls -la dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  publish-cli:
    name: publish CLI binaries to statichost instance
    needs: build-binaries
    runs-on: ubuntu-latest
    if: ${{ vars.STATICHOST_HOST != '' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: upload binaries to /dl
        env:
          STATICHOST_HOST: ${{ vars.STATICHOST_HOST }}
          STATICHOST_TOKEN: ${{ secrets.STATICHOST_TOKEN }}
        run: |
          set -e
          if [ -z "$STATICHOST_TOKEN" ]; then
            echo "STATICHOST_TOKEN secret is not set" >&2
            exit 1
          fi
          for f in artifacts/*/statichost-*; do
            name=$(basename "$f")
            echo "Uploading $name to $STATICHOST_HOST"
            curl -fSL --retry 3 --retry-delay 5 \
              -H "Authorization: Bearer $STATICHOST_TOKEN" \
              -F "filename=$name" \
              -F "binary=@$f" \
              "$STATICHOST_HOST/api/binaries/upload"
          done
          echo "All binaries uploaded."

  docker:
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: tag
        id: tag
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
